name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Build first: test/dist loads the built browser files.
      - run: npm run build
      - name: Tests with 100% coverage gate
        run: npm run test:coverage
      - name: Conformance report is current
        run: |
          npm run conformance:report
          git diff --quiet -I '^\* \*\*Generated\*\*' -- docs/conformance-report.md || { echo "docs/conformance-report.md is stale: run npm run conformance:report"; git diff -- docs/conformance-report.md; exit 1; }
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: dist
          path: dist/
