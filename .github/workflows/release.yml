name: Release

# Runs when tools/release.js pushes a version tag (vX.Y.Z or vX.Y.Z-pre.N).
#
#   build    verify the tag, build, run every gate, pack the tarball once
#   npm      publish that exact tarball with npm trusted publishing (OIDC): no stored
#            token, provenance attached automatically. Runs in the "npm" environment, which
#            can require a manual approval.
#   github   attest the files' build provenance and create the GitHub Release with the
#            tarball, the dist files, SHA256SUMS and the CHANGELOG notes
#
# Re-running a failed run is safe: each step skips work that is already done.
# npm side (one-time): package Settings > Trusted publishing > GitHub Actions, with
# owner "deftio", repository "bitwrench-a2ui", workflow "release.yml", environment "npm".
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      npm-tag: ${{ steps.meta.outputs.npm_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Pushed by a release maintainer
        # The v* tag ruleset already limits who can create release tags; this is a second
        # lock. RELEASE_MAINTAINERS is an optional repository variable (space separated logins).
        env:
          ACTOR: ${{ github.triggering_actor }}
          MAINTAINERS: ${{ vars.RELEASE_MAINTAINERS || 'deftio' }}
        run: |
          case " $MAINTAINERS " in
            *" $ACTOR "*) echo "release triggered by $ACTOR" ;;
            *) echo "::error::$ACTOR is not a release maintainer ($MAINTAINERS)"; exit 1 ;;
          esac
      - name: Tag matches package.json and is on main
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          [ "v$VERSION" = "$TAG" ] || { echo "::error::tag $TAG does not match package.json version $VERSION"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          [ "$(node -p 'require("./package.json").private === true')" = "false" ] || { echo "::error::package.json is private"; exit 1; }
          case "$VERSION" in *-*) echo "npm_tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT";;
                             *)   echo "npm_tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Committed dist/ matches this build
        run: git diff --exit-code -I '"built":' -- dist/ || { echo "::error::dist/ in the tag differs from a fresh build"; exit 1; }
      - run: npm run test:coverage
      - run: node tools/check-package.js --install
      - run: npm audit signatures
      - name: Pack, checksums and release notes
        id: pack
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p release
          # npm pack --json is an array up to npm 11 and an object keyed by name from npm 12.
          TARBALL="$(npm pack --ignore-scripts --pack-destination release --json | node -p 'const j = JSON.parse(require("fs").readFileSync(0, "utf8")); (Array.isArray(j) ? j[0] : Object.values(j)[0]).filename')"
          cp dist/bitwrench-a2ui.js dist/bitwrench-a2ui.min.js dist/bitwrench-a2ui.esm.min.js dist/bitwrench-a2ui.bundle.min.js dist/builds.json dist/THIRD_PARTY_LICENSES release/
          (cd release && sha256sum -- * > SHA256SUMS)
          # The CHANGELOG section for this version, without its heading.
          awk -v v="## $VERSION " 'index($0, v) == 1 { f = 1; next } f && /^## / { exit } f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            release-notes.md
          retention-days: 30
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/bitwrench-a2ui/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the tarball built and tested above
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARBALL: release/${{ needs.build.outputs.tarball }}
          NPM_TAG: ${{ needs.build.outputs.npm-tag }}
          # Only for the very first publish, if npm will not let you configure trusted
          # publishing before the package exists: add an NPM_TOKEN secret to the "npm"
          # environment, publish, then delete the secret and the token. Left unset, npm
          # authenticates with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "bitwrench-a2ui@$VERSION" version >/dev/null 2>&1; then
            echo "bitwrench-a2ui@$VERSION is already on npm; nothing to do."
            exit 0
          fi
          # npm is pinned, not floating: this step holds the publish credential, so the
          # client is the most privileged code in the pipeline. Bump it deliberately.
          npx -y npm@12.1.0 publish "$TARBALL" --access public --tag "$NPM_TAG" --provenance

  github:
    needs: [build, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestations
      attestations: write   # store them
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Attest build provenance of every released file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tgz
            release/*.js
            release/builds.json
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            FLAGS=""
            [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
            gh release create "$TAG" release/* --verify-tag --title "bitwrench-a2ui $TAG" --notes-file release-notes.md $FLAGS
          fi
