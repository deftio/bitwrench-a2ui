<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs · bitwrench-a2ui</title>
<meta name="description" content="Documentation for bitwrench-a2ui: quick start, A2UI and bitwrench primers, API, components, custom catalogs, theming, transports, static HTML, security and compatibility.">
</head>
<body>
<div id="site-nav"></div>
<main id="app" class="site-main wide"></main>
<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bitwrench@2.1.15/dist/bitwrench.umd.min.js" integrity="sha384-udDmcsr7TEJzzxbXOV5b0EaJuEcmQjGTZNDr8fNdR/xEMq7raSMWAGgLZOqU6JLu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/quikdown@1.3.2/dist/quikdown.umd.min.js" integrity="sha384-to3X/tf8wpxb1cFKai6VizOilq5SgtZEFCeWZ5QRTX6jxrwaTC1bLRmqF42q83dY" crossorigin="anonymous"></script>
<script src="../dist/bitwrench-a2ui.min.js"></script>
<script src="site.js"></script>
<script>
(function () {
  const styles = site.initPage('docs.html', { wide: true });
  const p = styles.palette;
  // The documents live in ../docs as Markdown (also readable on GitHub). quikdown renders
  // them here. This is the project's own trusted content, so its HTML output is inserted
  // directly; agent-provided Markdown never takes this path (see src/render/markdown.js).
  const DOCS = [
    ['Start here', [['README', 'Overview'], ['quick-start', 'Quick start'], ['a2ui-in-five-minutes', 'A2UI in five minutes'], ['bitwrench-primer', 'bitwrench in five minutes']]],
    ['Using it', [['api', 'API reference'], ['components', 'Components'], ['custom-catalogs', 'Custom catalogs'], ['theming', 'Theming'], ['streaming-and-transports', 'Streaming and transports'], ['static-html', 'Static HTML'], ['mcp-apps', 'MCP Apps'], ['using-with-llms', 'Using with LLMs']]],
    ['How it works', [['how-it-works', 'Architecture'], ['security', 'Security'], ['compatibility', 'Compatibility'], ['conformance-report', 'Conformance report'], ['testing', 'Testing'], ['faq', 'FAQ']]],
  ];
  const known = new Set(DOCS.flatMap(([, items]) => items.map(([id]) => id)));
  const GH = `${site.SITE.repo}/blob/main/`;

  bw.injectCSS(bw.css({
    '.docs': { display: 'grid', gap: '24px', 'grid-template-columns': '240px minmax(0, 1fr)', 'align-items': 'start' },
    '.docs-nav': { position: 'sticky', top: '68px', 'font-size': '0.95rem' },
    '.docs-nav h4': { margin: '16px 0 6px', 'font-size': '0.75rem', 'text-transform': 'uppercase', 'letter-spacing': '0.06em', color: p.textMuted },
    '.docs-nav a': { display: 'block', padding: '4px 8px', 'border-radius': '6px', color: 'inherit', 'text-decoration': 'none' },
    '.docs-nav a.active': { background: p.primary.light, color: p.primary.text, 'font-weight': '600' },
    '.docs-body': { 'max-width': '860px' },
    '.docs-body h1': { 'font-size': '2rem', margin: '0 0 16px' },
    '.docs-body h2': { 'font-size': '1.4rem', margin: '32px 0 8px', 'padding-top': '8px', 'border-top': `1px solid ${p.secondary.border}` },
    '.docs-body h3': { 'font-size': '1.1rem', margin: '24px 0 6px' },
    '.docs-body pre': { background: '#0f172a', color: '#e2e8f0', padding: '12px 14px', 'border-radius': '8px', overflow: 'auto', 'font-size': '0.85rem' },
    '.docs-body code': { 'font-family': '"SF Mono", Monaco, Consolas, monospace', 'font-size': '0.9em' },
    '.docs-body :not(pre) > code': { background: p.surfaceAlt, padding: '0.1em 0.35em', 'border-radius': '4px' },
    '.docs-body table': { 'border-collapse': 'collapse', margin: '12px 0', 'font-size': '0.95rem' },
    '.docs-body th, .docs-body td': { border: `1px solid ${p.secondary.border}`, padding: '6px 10px', 'text-align': 'left' },
    '.docs-body a': { color: p.primary.text },
    '.docs-body li': { margin: '4px 0' },
    '@media (max-width: 860px)': { '.docs': { 'grid-template-columns': '1fr' }, '.docs-nav': { position: 'static' } },
  }), { id: 'docs-css' });

  const params = new URLSearchParams(location.search);
  // The page fetches docs/<doc>.md: take the id from the site's own list, never from the URL.
  const doc = [...known].find(id => id === params.get('doc')) ?? 'README';

  bw.mount('#app', { t: 'div', a: { class: 'docs' }, c: [
    { t: 'nav', a: { class: 'docs-nav', 'aria-label': 'Documentation' }, c: DOCS.map(([group, items]) => [
      { t: 'h4', c: group },
      ...items.map(([id, label]) => ({ t: 'a', a: { href: `docs.html?doc=${id}`, class: id === doc ? 'active' : '', 'aria-current': id === doc ? 'page' : null }, c: label })),
    ]) },
    { t: 'article', a: { class: 'docs-body', id: 'doc-body' }, c: { t: 'p', a: { class: 'site-muted' }, c: 'Loading…' } },
  ] });

  function rewriteLinks(root) {
    for (const a of root.querySelectorAll('a[href]')) {
      const href = a.getAttribute('href');
      if (/^[a-z]+:/i.test(href) || href.startsWith('#')) continue;
      const m = /^(?:\.\/)?([\w-]+)\.md(#.*)?$/.exec(href);
      if (m && known.has(m[1])) { a.setAttribute('href', `docs.html?doc=${m[1]}${m[2] || ''}`); continue; }
      a.setAttribute('href', GH + href.replace(/^\.\.\//, '').replace(/^\.\//, 'docs/'));
    }
  }

  fetch(`../docs/${doc}.md`).then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); }).then(md => {
    // The docs are this repository's own Markdown (trusted), rendered to HTML by quikdown.
    bw.mount('#doc-body', [
      { t: 'div', a: { class: 'doc-md' }, c: bw.raw(quikdown(md)) },
      { t: 'p', a: { class: 'site-muted' }, c: ['Source: ', { t: 'a', a: { href: `${GH}docs/${doc}.md` }, c: `docs/${doc}.md` }] },
    ]);
    const body = document.getElementById('doc-body');
    rewriteLinks(body);
    const h1 = body.querySelector('h1');
    if (h1) document.title = `${h1.textContent} · bitwrench-a2ui`;
  }).catch(e => {
    bw.mount('#doc-body', { t: 'p', c: [`Could not load docs/${doc}.md (${e.message}). Read it on `, { t: 'a', a: { href: `${GH}docs/${doc}.md` }, c: 'GitHub' }, '.'] });
  });
})();
</script>
</body>
</html>
